# Local development database. CI uses a PostgreSQL service instead (same major version).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - '5432:5432'
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
      # Creates the extra kanban_test database on first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban -d kanban']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kanban_pgdata:
